services:
  postgres:
    image: postgres:18-alpine
    container_name: cyclesmart-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: cyclesmart
      POSTGRES_USER: cyclesmart
      POSTGRES_PASSWORD: cyclesmart_local_password
    ports:
      - "5432:5432"
    volumes:
      - cyclesmart-postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cyclesmart -d cyclesmart"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  cyclesmart-postgres-data:
